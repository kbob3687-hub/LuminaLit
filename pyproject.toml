[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperharness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "packaging>=23.0",
  "pydantic>=2.6",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
docker = [
  "docker>=7.0",
]
dev = [
  "pytest>=8",
  "ruff>=0.4",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["runs", "runs-test"]
